[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytest-zygote"
version = "0.1.0"
description = "Run pytest in parallel workers forked from one warm process, so the imports are paid once"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Pedro Fuentes", email = "pedrofuentes7799@gmail.com" }]
keywords = ["pytest", "parallel", "fork", "memory", "xdist", "plugin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
]
dependencies = ["pytest>=7.0"]

[project.optional-dependencies]
test = ["pytest-xdist>=3.0"]

[project.urls]
Homepage = "https://github.com/pedrofuentes79/pytest-zygote"
Issues = "https://github.com/pedrofuentes79/pytest-zygote/issues"
Changelog = "https://github.com/pedrofuentes79/pytest-zygote/blob/main/CHANGELOG.md"

[project.entry-points.pytest11]
zygote = "pytest_zygote.plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/pytest_zygote"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 103
# The plugin runs on 3.9; 3.14's PEP 758 would let the formatter strip the parentheses
# from `except (A, B)`, which every older Python rejects.
target-version = "py39"

[tool.ruff.lint]
# Pinned rather than left to the default, so CI lints the same as any contributor's machine.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
